---
- name: Load platform-specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_distribution }}.yml"
    - "{{ ansible_os_family }}.yml"
    - "default.yml"

- name: Include setup tasks for RedHat family
  include_tasks: setup-RedHat.yml
  when: ansible_os_family == 'RedHat'

- name: Include setup tasks for Debian
  include_tasks: setup-Debian.yml
  when: ansible_distribution == 'Debian'

- name: Include setup tasks for Ubuntu
  include_tasks: setup-Ubuntu.yml
  when: ansible_distribution == 'Ubuntu'

- name: Include setup tasks for Alpine
  include_tasks: setup-Alpine.yml
  when: ansible_distribution == 'Alpine'

- name: Run configuration tasks
  include_tasks: configuration.yml
