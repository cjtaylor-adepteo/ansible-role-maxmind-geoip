---
- name: Add Maxmind PPA repository | Ubuntu
  ansible.builtin.apt_repository:
    repo: ppa:maxmind/ppa
    state: present
    update_cache: yes

- name: Install Maxmind geoipupdate | Ubuntu
  ansible.builtin.apt:
    name: "{{ maxmind_update_packages }}"
    state: present
    update_cache: yes
